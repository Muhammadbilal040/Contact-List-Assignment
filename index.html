<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact List</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F1F4F8;
    --surface: #FFFFFF;
    --ink: #14213D;
    --muted: #64708A;
    --line: #DCE2EC;
    --primary: #0E7C86;
    --primary-dark: #0A626A;
    --primary-soft: #E2F3F4;
    --danger: #C8372D;
    --danger-soft: #FCEBE9;
    --radius: 12px;
    --font-head: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 20px 80px; }

  /* ---------- Header ---------- */
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  h1 { font-family: var(--font-head); font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; margin: 0; letter-spacing: -0.02em; }
  .count { color: var(--muted); font-size: 0.95rem; }

  /* ---------- Status banner ---------- */
  .banner { background: #FFF6DB; border: 1px solid #EBD483; color: #5C4A05; padding: 14px 16px; border-radius: var(--radius); margin-bottom: 24px; font-size: 0.95rem; }
  .banner.error { background: var(--danger-soft); border-color: #F0C2BD; color: #7A1F18; }
  .banner code { background: rgba(0,0,0,.07); padding: 1px 6px; border-radius: 5px; }
  .banner ul { margin: 6px 0 0; padding-left: 20px; }
  .banner[hidden] { display: none; }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 32px; align-items: start; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

  /* ---------- Form ---------- */
  .form-panel { padding: 24px; position: sticky; top: 20px; }
  .form-panel.editing { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .form-panel h2 { font-family: var(--font-head); font-size: 1.35rem; margin: 0 0 20px; }

  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
  input[type="text"], input[type="email"], input[type="search"] {
    width: 100%; padding: 11px 13px; font: inherit; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 9px;
  }
  input:focus-visible { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  input.invalid { border-color: var(--danger); }
  .error-text { color: var(--danger); font-size: 0.85rem; margin-top: 5px; min-height: 1.2em; }

  .btn-row { display: flex; gap: 10px; margin-top: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid transparent; padding: 11px 18px; font-weight: 600; transition: background .15s, border-color .15s; }
  button:focus-visible { outline: 3px solid var(--primary-soft); outline-offset: 1px; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; flex: 1; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn-ghost:hover { background: var(--bg); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #A62C24; }

  /* ---------- List ---------- */
  .search-box { position: relative; padding: 16px; border-bottom: 1px solid var(--line); }
  .search-box svg { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search-box input { padding-left: 40px; }

  .group-heading { font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; color: var(--primary); padding: 14px 20px 6px; background: #FAFBFD; border-bottom: 1px solid var(--line); }

  .contact { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .contact:last-child { border-bottom: none; }
  .contact:hover { background: #FAFBFD; }
  .contact.is-editing { background: var(--primary-soft); }

  .avatar { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.95rem; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .email { color: var(--muted); font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pending-tag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; background: #FFF1C7; color: #7A5B00; font-size: 0.75rem; font-weight: 600; vertical-align: 2px; }

  .actions { display: flex; gap: 6px; flex: none; }
  .icon-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; font-size: 0.88rem; background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .icon-btn:hover { background: var(--bg); }
  .icon-btn.delete { color: var(--danger); }
  .icon-btn.delete:hover { background: var(--danger-soft); border-color: #F0C2BD; }

  .empty { padding: 56px 24px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); font-family: var(--font-head); font-size: 1.15rem; margin-bottom: 4px; }

  /* ---------- Delete dialog ---------- */
  dialog { border: none; border-radius: var(--radius); padding: 26px; max-width: 400px; width: calc(100% - 40px); color: var(--ink); font-family: var(--font-body); box-shadow: 0 20px 60px rgba(20,33,61,.3); }
  dialog::backdrop { background: rgba(20,33,61,.45); }
  dialog h3 { font-family: var(--font-head); margin: 0 0 8px; font-size: 1.25rem; }
  dialog p { margin: 0 0 22px; color: var(--muted); }
  dialog .btn-row { justify-content: flex-end; }
  dialog .btn-row button { flex: none; }

  /* ---------- Toast ---------- */
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 0.95rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10; max-width: calc(100% - 40px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--danger); }

  /* ---------- Mobile ---------- */
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .form-panel { position: static; }
    .icon-btn span { display: none; }
    .icon-btn { padding: 9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

<body>
<div class="wrap">

  <header>
    <h1>Contacts</h1>
    <div class="count" id="count" aria-live="polite"></div>
  </header>

  <!-- Connection / setup messages yahan dikhte hain -->
  <div class="banner" id="banner" hidden></div>

  <div class="layout">

    <!-- ===== LEFT: Add / Edit form ===== -->
    <section class="panel form-panel" id="formPanel">
      <h2 id="formTitle">New contact</h2>

      <form id="contactForm" novalidate onsubmit="return false">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter Your Name" autocomplete="off">
          <div class="error-text" id="usernameError"></div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter You Email adress " autocomplete="off">
          <div class="error-text" id="emailError"></div>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-primary" id="submitBtn">Add contact</button>
          <button type="button" class="btn-ghost" id="cancelBtn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <!-- ===== RIGHT: Search + Contact list ===== -->
    <section class="panel">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Search by username or email" aria-label="Search contacts">
      </div>
      <div id="list"></div>
    </section>

  </div>
</div>

<!-- Delete confirmation -->
<dialog id="deleteDialog">
  <h3>Delete this contact?</h3>
  <p id="deleteText"></p>
  <div class="btn-row">
    <button type="button" class="btn-ghost" id="deleteCancel">Keep contact</button>
    <button type="button" class="btn-danger" id="deleteConfirm">Delete contact</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script type="module">
/* =====================================================================
   STEP 4 — FIREBASE KEYS YAHAN PASTE KAREIN
   Firebase Console → Project settings → Your apps → Web app → firebaseConfig
   Neeche wali "YOUR_..." values ko apni asli values se replace kar dein.
   ===================================================================== */
const firebaseConfig = {
    apiKey: "AIzaSyC7VL-wZdQ3g1YEPyheHWkO2iYvuKjsk0I",
    authDomain: "contact-list-40b9b.firebaseapp.com",
    databaseURL: "https://contact-list-40b9b-default-rtdb.firebaseio.com",
    projectId: "contact-list-40b9b",
    storageBucket: "contact-list-40b9b.firebasestorage.app",
    messagingSenderId: "677748727619",
    appId: "1:677748727619:web:6905d350784439a31b99f6"
  };
/* ===================================================================== */

/* Firebase library ke do sources: pehla fail ho to doosra try hota hai */
const SOURCES = [
  {
    app: "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    firestore: "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  },
  {
    app: "https://cdn.jsdelivr.net/npm/firebase@10.12.2/app/+esm",
    firestore: "https://cdn.jsdelivr.net/npm/firebase@10.12.2/firestore/+esm"
  }
];

/* ---------- Helpers ---------- */
const $ = (id) => document.getElementById(id);
const escapeHTML = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let toastTimer;
function toast(message, isError = false) {
  const t = $("toast");
  t.textContent = message;
  t.classList.toggle("error", isError);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), isError ? 5000 : 2800);
}

function showBanner(html, isError = false) {
  const b = $("banner");
  b.innerHTML = html;
  b.classList.toggle("error", isError);
  b.hidden = false;
}
function hideBanner() { $("banner").hidden = true; }

/* ---------- App state ---------- */
const isConfigured = !Object.values(firebaseConfig).some((v) => String(v).startsWith("YOUR_"));
let F = null;             // Firebase functions (load hone ke baad)
let db = null;
let contactsRef = null;
let contacts = [];        // Firestore se aane wala saara data
let loaded = !isConfigured;   // false = "Loading..." dikhao
let editingId = null;     // null = add mode, warna edit mode
let deletingId = null;
let searchText = "";

/* ---------- Avatar colors (name ke hisaab se fixed rang) ---------- */
const AVATARS = [
  ["#E2F3F4", "#0A626A"], ["#FDE8D9", "#9A4A17"], ["#E8E9FB", "#3F44A8"],
  ["#FBE4EE", "#A3305F"], ["#E6F4DA", "#3F7A18"], ["#FFF1C7", "#7A5B00"]
];
function avatarFor(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATARS[h % AVATARS.length];
}

/* =====================================================================
   RENDER — list ko screen par dikhana
   ===================================================================== */
function render() {
  const list = $("list");

  if (!loaded) {
    $("count").textContent = "";
    list.innerHTML = `<div class="empty"><strong>Loading contacts…</strong>Connecting to your database.</div>`;
    return;
  }

  const q = searchText.trim().toLowerCase();

  // Search filter (username ya email dono me)
  const filtered = contacts
    .filter((c) => !q || c.username.toLowerCase().includes(q) || c.email.toLowerCase().includes(q))
    .sort((a, b) => a.username.localeCompare(b.username, undefined, { sensitivity: "base" }));

  $("count").textContent = contacts.length
    ? (q ? `${filtered.length} of ${contacts.length} contacts` : `${contacts.length} ${contacts.length === 1 ? "contact" : "contacts"}`)
    : "";

  if (!filtered.length) {
    list.innerHTML = contacts.length
      ? `<div class="empty"><strong>No match found</strong>No contact matches “${escapeHTML(searchText)}”. Try a different name or email.</div>`
      : `<div class="empty"><strong>No contacts yet</strong>Add your first contact using the form.</div>`;
    return;
  }

  // Pehle harf ke hisaab se groups (A, B, C ...)
  const groups = {};
  for (const c of filtered) {
    const first = c.username.charAt(0).toUpperCase();
    const key = /[A-Z]/.test(first) ? first : "#";
    (groups[key] = groups[key] || []).push(c);
  }

  let html = "";
  for (const letter of Object.keys(groups).sort()) {
    html += `<div class="group-heading">${letter}</div>`;
    for (const c of groups[letter]) {
      const [bg, fg] = avatarFor(c.username);
      html += `
        <div class="contact ${c.id === editingId ? "is-editing" : ""}">
          <div class="avatar" style="background:${bg};color:${fg}">${escapeHTML(c.username.slice(0, 2).toUpperCase())}</div>
          <div class="info">
            <div class="name">${escapeHTML(c.username)}${c.pending ? '<span class="pending-tag">Saving…</span>' : ""}</div>
            <div class="email">${escapeHTML(c.email)}</div>
          </div>
          <div class="actions">
            <button class="icon-btn edit" data-id="${c.id}" aria-label="Edit ${escapeHTML(c.username)}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              <span>Edit</span>
            </button>
            <button class="icon-btn delete" data-id="${c.id}" aria-label="Delete ${escapeHTML(c.username)}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
              <span>Delete</span>
            </button>
          </div>
        </div>`;
    }
  }
  list.innerHTML = html;
}

/* =====================================================================
   FORM — add / edit mode
   ===================================================================== */
function setMode(id) {
  editingId = id;
  const editing = id !== null;
  $("formTitle").textContent = editing ? "Edit contact" : "New contact";
  $("submitBtn").textContent = editing ? "Save changes" : "Add contact";
  $("cancelBtn").hidden = !editing;
  $("formPanel").classList.toggle("editing", editing);
  render();
}

function resetForm() {
  $("contactForm").reset();
  clearErrors();
  setMode(null);
}

function clearErrors() {
  for (const f of ["username", "email"]) {
    $(f).classList.remove("invalid");
    $(f + "Error").textContent = "";
  }
}

function showError(field, message) {
  $(field).classList.add("invalid");
  $(field + "Error").textContent = message;
}

function validate(username, email) {
  clearErrors();
  let ok = true;

  if (!username) { showError("username", "Enter a username."); ok = false; }

  if (!email) { showError("email", "Enter an email address."); ok = false; }
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError("email", "Enter a valid email, like name@example.com."); ok = false; }
  else if (contacts.some((c) => c.email.toLowerCase() === email.toLowerCase() && c.id !== editingId)) {
    showError("email", "This email is already in your contacts."); ok = false;
  }
  return ok;
}

/* ---------- Error messages ---------- */
function friendlyError(err) {
  if (err && err.code === "permission-denied") {
    return "Permission denied. Firestore → Rules mein test mode (allow read, write: if true) set karein.";
  }
  return "Something went wrong (" + ((err && (err.code || err.message)) || "unknown") + "). Check your connection and try again.";
}

/* =====================================================================
   STEP 5 — DATA STORE: ADD + EDIT (form submit)
   Write turant local list me dikh jata hai, server confirm baad me hota hai.
   ===================================================================== */
$("contactForm").addEventListener("submit", (e) => {
  e.preventDefault();

  if (!isConfigured) { toast("Pehle Firebase keys paste karein (Step 4).", true); return; }
  if (!F || !contactsRef) { toast("Firebase abhi connect nahi hui. Thora intezar karein ya page refresh karein.", true); return; }

  const username = $("username").value.trim();
  const email = $("email").value.trim();
  if (!validate(username, email)) return;

  if (editingId) {
    // EDIT — purana document update
    F.updateDoc(F.doc(db, "contacts", editingId), { username, email })
      .then(() => toast("Contact updated"))
      .catch((err) => { console.error(err); toast(friendlyError(err), true); });
  } else {
    // ADD — naya document
    F.addDoc(contactsRef, { username, email, createdAt: F.serverTimestamp() })
      .then(() => toast("Contact saved"))
      .catch((err) => { console.error(err); toast(friendlyError(err), true); });
  }
  resetForm();
});

$("cancelBtn").addEventListener("click", resetForm);

/* =====================================================================
   EDIT / DELETE buttons (list ke andar)
   ===================================================================== */
$("list").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-id]");
  if (!btn) return;
  const contact = contacts.find((c) => c.id === btn.dataset.id);
  if (!contact) return;

  if (btn.classList.contains("edit")) {
    // Form me purana data bhar do
    $("username").value = contact.username;
    $("email").value = contact.email;
    clearErrors();
    setMode(contact.id);
    $("formPanel").scrollIntoView({ behavior: "smooth", block: "nearest" });
    $("username").focus();
  }

  if (btn.classList.contains("delete")) {
    deletingId = contact.id;
    $("deleteText").textContent = `${contact.username} (${contact.email}) will be removed permanently.`;
    $("deleteDialog").showModal();
  }
});

/* ---------- DELETE ---------- */
$("deleteCancel").addEventListener("click", () => $("deleteDialog").close());

$("deleteConfirm").addEventListener("click", () => {
  const id = deletingId;
  $("deleteDialog").close();
  if (!id || !F) return;

  F.deleteDoc(F.doc(db, "contacts", id))
    .then(() => toast("Contact deleted"))
    .catch((err) => { console.error(err); toast(friendlyError(err), true); });

  if (editingId === id) resetForm();
});

/* ---------- SEARCH ---------- */
$("search").addEventListener("input", (e) => {
  searchText = e.target.value;
  render();
});

/* =====================================================================
   FIREBASE — load + connect + realtime data
   ===================================================================== */
async function loadFirebase() {
  for (const src of SOURCES) {
    try {
      const [appLib, fsLib] = await Promise.all([import(src.app), import(src.firestore)]);
      return { ...appLib, ...fsLib };
    } catch (err) {
      console.warn("Firebase load failed from", src.app, err);
    }
  }
  throw new Error("Firebase library could not be loaded");
}

const NOT_REACHABLE = `<strong>Database se connect nahi ho raha.</strong> Ye cheezein check karein:
  <ul>
    <li>Firebase Console → <b>Firestore Database</b> create hui hai?</li>
    <li>Rules <b>test mode</b> mein hain (<code>allow read, write: if true;</code>)?</li>
    <li><code>projectId</code> aur <code>apiKey</code> sahi paste hui hain?</li>
    <li>Internet chal raha hai? VPN ya ad-blocker band karke refresh karein.</li>
  </ul>`;

async function connect() {
  try {
    F = await loadFirebase();
  } catch (err) {
    console.error(err);
    loaded = true; render();
    showBanner("<strong>Firebase library load nahi ho saki.</strong> Internet check karein, VPN ya ad-blocker band karein aur page refresh karein.", true);
    return;
  }

  try {
    const app = F.initializeApp(firebaseConfig);
    // Long-polling auto-detect: kuch networks par connection stable rehta hai
    db = F.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
    contactsRef = F.collection(db, "contacts");
  } catch (err) {
    console.error(err);
    loaded = true; render();
    showBanner("<strong>Firebase config me masla hai.</strong> Keys dobara copy karke paste karein. (" + escapeHTML(err.message || err) + ")", true);
    return;
  }

  let serverReached = false;
  const slowTimer = setTimeout(() => {
    if (!serverReached) { loaded = true; render(); showBanner(NOT_REACHABLE, true); }
  }, 10000);

  // onSnapshot = jab bhi database me change ho, list khud update ho jati hai
  F.onSnapshot(
    contactsRef,
    { includeMetadataChanges: true },
    (snapshot) => {
      contacts = snapshot.docs.map((d) => ({ id: d.id, ...d.data(), pending: d.metadata.hasPendingWrites }));
      loaded = true;
      if (!snapshot.metadata.fromCache) {   // server se confirm ho gaya
        serverReached = true;
        clearTimeout(slowTimer);
        hideBanner();
      }
      render();
    },
    (err) => {
      console.error(err);
      clearTimeout(slowTimer);
      loaded = true; render();
      showBanner("<strong>Database error:</strong> " + escapeHTML(friendlyError(err)), true);
    }
  );
}

/* ---------- START ---------- */
render();   // page turant dikhao
if (!isConfigured) {
  showBanner("<strong>Firebase keys abhi add nahi hui.</strong> File kholein aur <code>firebaseConfig</code> ke andar apni keys paste karein (Step 4).");
} else {
  connect();
}
</script>
</body>
</html>
